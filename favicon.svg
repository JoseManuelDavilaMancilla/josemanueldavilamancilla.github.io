<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="MD">
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="8" fill="#000000"/>
  <rect x="1" y="1" width="62" height="62" rx="7" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1"/>
  <text x="32" y="42" text-anchor="middle" font-family="EB Garamond, Georgia, serif" font-size="28" fill="#ffffff" filter="url(#glow)">MD</text>
</svg>
